name: ci

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - .github/workflows/ci.yaml
  workflow_dispatch:
  pull_request:
    paths:
      - apps/api/**
      - .github/workflows/ci.yaml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/platform-lab-api

defaults:
  run:
    working-directory: apps/api

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Testes (unitários + integração com Postgres)
        env:
          TEST_DATABASE_URL: postgresql://app:app@localhost:5432/app
        run: pytest -v

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build (carrega localmente para o scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/api
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          build-args: VERSION=${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (falha em HIGH/CRITICAL com correção disponível)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy SARIF (aba Security do GitHub)
        if: always() && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          format: sarif
          output: trivy.sarif
          skip-setup-trivy: true
          # Mesma política do gate acima. Sem isto o SARIF leva todas as severidades,
          # inclusive CVEs sem correção da imagem base, e a aba Security vira ruído.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
      - if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        working-directory: .
        run: docker push "$IMAGE:${{ steps.vars.outputs.tag }}"

  # GitOps: o CI não fala com o cluster. Ele só altera o estado desejado no Git,
  # e o Argo CD aplica. Commits feitos com GITHUB_TOKEN não disparam novos workflows,
  # então não há loop.
  bump-dev:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Atualiza image.tag de dev
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          yq -i '.image.tag = strenv(TAG)' gitops/envs/dev/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(dev): api ${TAG}"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
