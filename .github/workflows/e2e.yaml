name: e2e

# Sobe a plataforma inteira num runner do GitHub, exatamente como `make up` faz localmente.
# O Argo CD lê o estado desejado da branch main no GitHub, então este teste valida a main.
on:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Atualizar as capturas de tela em docs/img
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: [infra/**, charts/**, gitops/**, scripts/**, .github/workflows/e2e.yaml]

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: true

jobs:
  platform:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KUBECONFIG: /home/runner/.kube/platform-lab
      STATE_DIR: /home/runner/.config/platform-lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
        with:
          version: v4.3.1
      - name: Limites de inotify para kind com vários nós
        run: sudo sysctl -w fs.inotify.max_user_watches=524288 fs.inotify.max_user_instances=512
      - name: Cluster (Terraform + kind)
        run: make cluster
      - name: Bootstrap (segredos iniciais + Argo CD + App of Apps)
        run: make bootstrap
      - name: Aguarda a plataforma
        run: TIMEOUT=1500 scripts/wait-platform.sh
      - name: Smoke test pelo Gateway (HTTPS na porta 443 do host)
        timeout-minutes: 5
        run: |
          make ca
          # Cada verificação vira uma linha no resumo da execução.
          check() { echo "| $1 | \`$2\` | ✅ |" >> "$RUNNER_TEMP/checks.md"; }
          # Sem timeout, uma conexão que abre e nunca responde segura o curl por minutos.
          t=(--connect-timeout 5 --max-time 15)
          for path in /readyz /api/items /version; do
            body=$(curl -fsS "${t[@]}" --retry 10 --retry-delay 6 --retry-all-errors \
              --cacert "$STATE_DIR/ca.crt" "https://api-dev.localhost${path}")
            echo "$body"
            check "API dev via Gateway (TLS)" "GET ${path} → ${body:0:40}"
          done
          code=$(curl -fsS "${t[@]}" -o /dev/null -w "%{http_code}" --cacert "$STATE_DIR/ca.crt" https://grafana.localhost/login)
          check "Grafana" "HTTPS ${code}"
          code=$(curl -fsS "${t[@]}" -o /dev/null -w "%{http_code}" --cacert "$STATE_DIR/ca.crt" https://argocd.localhost/)
          check "Argo CD" "HTTPS ${code}"
          code=$(curl -s "${t[@]}" -o /dev/null -w "%{http_code}" http://api-dev.localhost/api/items)
          test "$code" = "301"
          check "Redirecionamento HTTP → HTTPS" "HTTP ${code}"
      - name: Prometheus coleta a API
        run: |
          kubectl -n monitoring port-forward svc/prometheus-operated 9090 >/dev/null 2>&1 &
          sleep 5
          for _ in $(seq 1 20); do
            up=$(curl -s 'http://127.0.0.1:9090/api/v1/query' --data-urlencode 'query=up{namespace="api-dev",service="api"}' \
              | jq -r '.data.result | length')
            if [ "$up" -gt 0 ]; then
              echo "alvos da API: $up"
              echo "| Prometheus coleta a API | \`up{namespace=\"api-dev\"}\` → ${up} alvo(s) | ✅ |" >> "$RUNNER_TEMP/checks.md"
              exit 0
            fi
            sleep 15
          done
          echo "Prometheus não encontrou a API"; exit 1
      - name: Tráfego sintético (para os gráficos terem dados)
        run: |
          end=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$end" ]; do
            for path in /api/items /api/items/1 /version /api/items; do
              curl -s -o /dev/null --max-time 5 --cacert "$STATE_DIR/ca.crt" "https://api-dev.localhost${path}" &
            done
            wait
            sleep 0.2
          done
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Capturas de tela (Argo CD e Grafana)
        id: shots
        continue-on-error: true
        run: |
          pip install --quiet playwright==1.64.1
          python -m playwright install --with-deps chromium >/dev/null
          python scripts/screenshots.py screenshots
      - name: Publica as capturas
        if: steps.shots.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/*.png
          retention-days: 30
      - name: Resumo
        if: always()
        run: |
          {
            echo "## Plataforma completa num runner do GitHub"
            echo
            echo "Cluster kind (1 control-plane + 2 workers) criado por Terraform, Argo CD sincronizando"
            echo "toda a plataforma a partir da \`main\` e verificações de ponta a ponta:"
            echo
            echo "| Verificação | Detalhe | Resultado |"
            echo "|---|---|---|"
            cat "$RUNNER_TEMP/checks.md" 2>/dev/null
            echo
            echo "### Applications do Argo CD"
            echo
            echo "| Application | Sync | Health |"
            echo "|---|---|---|"
            kubectl -n argocd get applications.argoproj.io --no-headers \
              -o custom-columns='N:.metadata.name,S:.status.sync.status,H:.status.health.status' 2>/dev/null \
              | awk '{printf "| %s | %s | %s |\n", $1, $2, $3}'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnóstico
        if: failure()
        run: |
          set +e
          kubectl -n argocd get applications.argoproj.io -o wide
          for app in $(kubectl -n argocd get applications.argoproj.io -o jsonpath='{range .items[?(@.status.health.status!="Healthy")]}{.metadata.name}{" "}{end}'); do
            echo "::group::application $app"
            kubectl -n argocd get application "$app" -o jsonpath='{.status.conditions}{"\n"}{.status.operationState.message}{"\n"}'
            kubectl -n argocd get application "$app" -o jsonpath='{range .status.resources[?(@.health.status!="Healthy")]}{.kind}/{.namespace}/{.name}: {.health.status} {.health.message}{"\n"}{end}'
            echo "::endgroup::"
          done
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -60
          kubectl get gateway,httproute -A
          kubectl -n envoy-gateway-system get svc -o wide
          gc='{range .items[*]}{.metadata.name} gen={.metadata.generation}{"\n"}'
          gc+='{range .status.conditions[*]}  {.type}={.status} obsGen={.observedGeneration} {.reason}: {.message}{"\n"}{end}{end}'
          kubectl get gatewayclass -o jsonpath="$gc"
          kubectl -n envoy-gateway-system get envoyproxy -o jsonpath='{range .items[*].status.ancestors[*].conditions[*]}{.type}={.status} {.reason}: {.message}{"\n"}{end}'
          kubectl -n envoy-gateway-system logs deploy/envoy-gateway | grep -iE 'error|invalid|parametersRef' | tail -20
          for p in $(kubectl get pods -A --no-headers | awk '$4!="Running" && $4!="Completed" {print $1"/"$2}'); do
            echo "::group::$p"; kubectl -n "${p%/*}" describe pod "${p#*/}" | tail -30; kubectl -n "${p%/*}" logs "${p#*/}" --all-containers --tail=40; echo "::endgroup::"
          done

  # As capturas do README saem da plataforma rodando de verdade. Só quando pedido
  # manualmente, e com escrita restrita a este job.
  screenshots:
    needs: platform
    if: inputs.update_screenshots
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: docs/img
      - name: Commit das capturas
        run: |
          git add docs/img
          if git diff --cached --quiet; then echo "Capturas iguais às atuais"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: capturas de tela geradas pelo e2e"
          git push
