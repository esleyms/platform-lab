# Ambiente de desenvolvimento sem Kubernetes: docker compose up --build
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      APP_DATABASE_URL: postgresql://app:app@db:5432/app
      APP_LOG_LEVEL: INFO
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
