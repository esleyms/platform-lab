{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames:
    - {{ required "route.hostname é obrigatório" .Values.route.hostname | quote }}
  rules:
    # /metrics fica fora da rota pública; o Prometheus coleta direto pelo Service.
    - matches:
        - path: { type: PathPrefix, value: /api }
        - path: { type: Exact, value: /healthz }
        - path: { type: Exact, value: /readyz }
        - path: { type: Exact, value: /version }
      backendRefs:
        - name: {{ include "api.fullname" . }}
          port: 80
{{- end }}
