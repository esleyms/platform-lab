# EnvoyProxy: como os proxies são implantados. NodePorts fixos para casar com o
# extraPortMappings do kind (infra/terraform/kind/main.tf).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kind-nodeport
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
      envoyService:
        type: NodePort
        # O Envoy Gateway usa Local por padrão: o NodePort só responde no nó que roda o
        # pod do Envoy. No kind o tráfego do host entra pelo control-plane, onde não há
        # Envoy, e a conexão é descartada. Cluster deixa o kube-proxy encaminhar entre nós
        # (custo: perde o IP de origem do cliente, irrelevante neste laboratório).
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
                - port: 443
                  nodePort: 30443
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: kind-nodeport
    namespace: envoy-gateway-system
---
# Gateway compartilhado. Só namespaces com o label platform-lab/gateway-access=true
# podem anexar rotas: um time não consegue publicar um hostname sem a plataforma liberar.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: platform-gateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform-lab/gateway-access: "true"
---
# Todo HTTP vira HTTPS. A rota fica no namespace do Gateway (listener http: from Same).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: platform
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
