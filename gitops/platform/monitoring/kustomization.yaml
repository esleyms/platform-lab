apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - grafana-route.yaml

# O sidecar do Grafana carrega todo ConfigMap com grafana_dashboard=1.
configMapGenerator:
  - name: dashboard-api-slo
    files:
      - dashboards/api-slo.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: platform-lab
