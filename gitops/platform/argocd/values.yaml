# Usado em dois lugares: no `helm install` do bootstrap e na Application que
# mantém o Argo CD gerenciando a si mesmo. Os dois precisam ficar idênticos.
# Nomes curtos e estáveis (argocd-server, argocd-repo-server...). Sem isto o chart
# geraria argocd-argo-cd-server, porque o release se chama argocd.
fullnameOverride: argocd

global:
  domain: argocd.localhost

configs:
  params:
    # TLS termina no Gateway; o argocd-server fala HTTP dentro do cluster.
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
    # Desde o Argo CD 1.8 a saúde de uma Application não é avaliada por padrão.
    # Sem isto, as sync-waves do App of Apps não esperam os filhos ficarem Healthy.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  repositories:
    # O chart do Envoy Gateway só é publicado em registry OCI.
    envoyproxy-oci:
      name: envoyproxy
      type: helm
      url: docker.io/envoyproxy
      enableOCI: "true"

dex:
  enabled: false

notifications:
  enabled: false

controller:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

server:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

applicationSet:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 128Mi }

redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
