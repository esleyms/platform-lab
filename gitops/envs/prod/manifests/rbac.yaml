# Acesso humano por grupo, nunca por usuário individual. Em dev o time edita;
# em prod só lê. Mudanças em prod passam pelo Git e pelo Argo CD.
# Teste: kubectl auth can-i create deployments -n api-prod --as=dev@lab --as-group=platform-lab:developers
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developers
subjects:
  - kind: Group
    name: platform-lab:developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
