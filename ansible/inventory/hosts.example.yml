# Copie para inventory/hosts.yml (ignorado pelo Git) e ajuste o IP e o usuário.
all:
  children:
    lab:
      hosts:
        lab-vm:
          ansible_host: 192.168.56.10
          ansible_user: ubuntu
      vars:
        admin_user: ubuntu
        # Chave pública que poderá logar depois que a senha for desligada.
        admin_ssh_pubkey: "{{ lookup('ansible.builtin.file', '~/.ssh/id_ed25519.pub') }}"
