#   ansible-playbook site.yml
- name: Preparar host do platform-lab
  hosts: lab
  become: true
  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening]
    - role: docker
      tags: [docker]
    - role: k8s_tools
      tags: [tools]
